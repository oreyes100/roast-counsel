# Replace __DOMAIN__ with the approved public hostname before installing.
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 64k;
    auth_basic "Roast Counsel";
    auth_basic_user_file /etc/nginx/auth/roast-counsel.htpasswd;
    location / {
        proxy_pass http://127.0.0.1:4730;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
